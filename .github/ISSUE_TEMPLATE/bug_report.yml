name: 🐞 Bug report
description: Report a bug or an issue.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        # Morphe Patches bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/MorpheApp/morphe-patches/issues?q=is%3Aissue).
        - **Report one bug per issue**: Open a separate issue for each bug.
        - Bug reports that do not use this form are deleted automatically.
  - type: dropdown
    id: app
    attributes:
      label: App
      description: The app that has the bug
      options:
        - YouTube
        - YouTube Music
        - YouTube and YouTube Music
        - Reddit
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version of the app you patched
      placeholder: 'e.g. 21.30.216'
    validations:
      required: true
  - type: input
    id: patches-version
    attributes:
      label: Patches version
      description: The patches version shown in Settings > About
      placeholder: 'e.g. 2.3.0'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: |
        - Describe what happens and what you expected to happen
        - Add steps to reproduce the bug (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error logs
      description: Exceptions can be captured by running `logcat | grep AndroidRuntime` in a shell.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: All requested information has been provided properly.
          required: true
