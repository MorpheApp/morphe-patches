name: ⭐ Feature request
description: Create a detailed request for a new feature.
title: 'feat: '
labels: ['feature']
body:
  - type: markdown
    attributes:
      value: |
        # Morphe Patches feature request

        Before creating a new feature request, please keep the following in mind:

        - We are currently only accept feature requests for YouTube, YT Music, and Reddit.
        - **Do not submit a duplicate feature request**: Search for existing feature requests, including closed issues, [here](https://github.com/MorpheApp/morphe-patches/issues?q=is%3Aissue).
        - Feature requests that do not use this form are deleted automatically.
  - type: dropdown
    id: app
    attributes:
      label: App
      description: The app the feature is for
      options:
        - YouTube
        - YouTube Music
        - YouTube and YouTube Music
        - Reddit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: |
        - Describe your feature in detail
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        A strong motivation is necessary for a feature request to be considered.

        - Why should this feature be implemented?
        - What is the explicit use case?
        - What are the benefits?
        - What makes this feature important?
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your feature request will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed feature requests and this is not a duplicate
          required: true
        - label: This is a feature request for YouTube, YT Music, or Reddit
          required: true
