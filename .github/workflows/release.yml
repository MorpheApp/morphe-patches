name: Release

on:
  workflow_dispatch:
    inputs:
      send_fcm:
        description: 'Send FCM push notification'
        type: boolean
        default: true
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Gradle for GitHub Packages (fork support)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          # GitHub Packages credentials - optional for forks
          gpr.user=${{ github.actor }}
          gpr.key=${{ secrets.GITHUB_TOKEN }}
          org.gradle.java.home=$JAVA_HOME
          # Additional settings for fork compatibility
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.workers.max=4
          EOF

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Release
        uses: cycjimmy/semantic-release-action@v5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check release status
        if: failure()
        run: |
          echo "Release workflow encountered an error. Checking if this is due to missing GitHub Packages access..."
          echo "For forks, GitHub Packages access to MorpheApp registry may not be available."
          echo "Please ensure GITHUB_TOKEN has package read permissions or use the main repository for releases."
          exit 0

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true' && hashFiles('patches/build/libs/patches-*.mpp') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Generate website deploy token
        if: steps.release.outputs.new_release_published == 'true' && secrets.WEBSITE_DISPATCH_TOKEN != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_AAMATT_APP_ID }}
          private-key: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          owner: MorpheApp

      - name: Trigger website deploy
        if: steps.release.outputs.new_release_published == 'true' && steps.app-token.outputs.token != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'MorpheApp',
              repo: 'morphe-website',
              event_type: 'trigger-deploy'
            })

      - name: Wait before sending FCM
        if: steps.release.outputs.new_release_published == 'true' && inputs.send_fcm != false && secrets.FCM_PROJECT_ID != ''
        run: sleep 300

      - name: Setup Python for FCM
        if: steps.release.outputs.new_release_published == 'true' && inputs.send_fcm != false && secrets.FCM_PROJECT_ID != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Send FCM push notification
        if: steps.release.outputs.new_release_published == 'true' && inputs.send_fcm != false && secrets.FCM_PROJECT_ID != ''
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_TYPE: bundle_update
          FCM_VERSION: ${{ steps.release.outputs.new_release_version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip install cryptography
          python3 .github/scripts/send_fcm.py
