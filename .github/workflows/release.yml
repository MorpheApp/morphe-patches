name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Morphe Patches (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid generatePatchesList --no-daemon
          rm -f patches/build/libs/*-sources.mpp patches/build/libs/*-javadoc.mpp
          cp patches/build/libs/patches-*.mpp patches/build/libs/venom-patches.mpp

      - name: Update patches-bundle.json for Source URL
        run: |
          rm -f morphe-signing.pub
          cat <<EOF > patches-bundle.json
          {
            "created_at": "$(date -u +"%Y-%m-%dT%H:%M:%S")",
            "description": "Venom Custom Morphe Patches",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/v2.2.0-venom.${{ github.run_number }}/venom-patches.mpp",
            "signature_download_url": "",
            "version": "2.2.0-venom.${{ github.run_number }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A patches-bundle.json morphe-signing.pub
          git diff --staged --quiet || git commit -m "chore: update patches-bundle.json [skip ci]"
          git push

      - name: Publish Direct .mpp to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-venom.${{ github.run_number }}
          name: Venom Patches v2.2.0 (Build ${{ github.run_number }})
          body: "Download venom-patches.mpp below, or paste the repo URL into Morphe Manager Source URL."
          files: |
            patches/build/libs/venom-patches.mpp
