name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Morphe Patches (.mpp)
        run: |
          chmod +x gradlew
          ./gradlew build generatePatchesList --no-daemon

      - name: Upload .mpp to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: venom-patches-mpp
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/*.jar

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-venom.${{ github.run_number }}
          name: Venom Patches v2.2.0 (Build ${{ github.run_number }})
          body: "Custom Morphe Patches with BookMyShow Comment Word Tags and WLPro Smart Playlist Tags."
          files: |
            patches/build/libs/*.mpp
            
