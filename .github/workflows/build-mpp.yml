name: Build MPP

on:
  workflow_dispatch:
  push:
    branches: [livechat, livechat2, livechat7]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show base and check patch files
        run: |
          echo "base: $(git log --oneline -1)"
          grep -c "onLithoTextLoaded" \
            extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/LiveChatTranslatePatch.java
          grep -c "LIVE_CHAT_TRANSLATE_COPY_BUTTON" \
            extensions/youtube/src/main/java/app/morphe/extension/youtube/settings/Settings.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build patches bundle
        run: |
          export GITHUB_ACTOR=Yondaime-kun
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          ./gradlew buildAndroid --no-daemon
      - name: Upload mpp
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/*.mpp
