syntax = "proto3";

import "app/morphe/extension/shared/innertube/response_context.proto";

package app.morphe.extension.shared.innertube;

option optimize_for = LITE_RUNTIME;
option java_package = "app.morphe.extension.shared.innertube";

message PlayerResponse {
  optional ResponseContext responseContext = 1;
  optional PlayabilityStatus playabilityStatus = 2;
  optional StreamingData streamingData = 4;
  optional VideoDetails videoDetails = 11;
  optional PlayerConfig playerConfig = 15;
}

// Field numbers read off a real player response, since asking for "videoDetails"
// in the fields mask returns nothing.
message VideoDetails {
  optional string videoId = 1;
  optional string title = 15;
  optional int32 lengthSeconds = 16;
  optional string channelId = 19;
  optional ThumbnailList thumbnail = 25;
  optional string ownerChannelName = 33;
}

message ThumbnailList {
  repeated ThumbnailEntry thumbnails = 1;
}

message ThumbnailEntry {
  optional string url = 1;
  optional int32 width = 2;
  optional int32 height = 3;
}

message PlayabilityStatus {
  optional Status status = 1;
  optional string reason = 2;
}

enum Status {
  OK = 0;
  ERROR = 1;
  UNPLAYABLE = 2;
  LOGIN_REQUIRED = 3;
  CONTENT_CHECK_REQUIRED = 4;
  AGE_CHECK_REQUIRED = 5;
  LIVE_STREAM_OFFLINE = 6;
  FULLSCREEN_ONLY = 7;
  GL_PLAYBACK_REQUIRED = 8;
  AGE_VERIFICATION_REQUIRED = 9;
}

message StreamingData {
  repeated Format formats = 2;
  repeated Format adaptiveFormats = 3;
  optional string serverAbrStreamingUrl = 15;
}

message Format {
  optional int32 itag = 1;
  optional int32 bitrate = 6;
  optional int32 averageBitrate = 31;
  optional int32 audioChannels = 46;
  optional int64 approxDurationMs = 44;
  optional int64 audioSampleRate = 45;
  optional int64 contentLength = 12;
  optional string mimeType = 5;
  optional string url = 2;
  optional string signatureCipher = 48;
}

message PlayerConfig {
  optional AudioConfig audioConfig = 55405814;
  optional ExoPlayerConfig exoPlayerConfig = 57825011;
  optional AndroidMedialibConfig androidMedialibConfig = 78958444;
  optional MediaCommonConfig mediaCommonConfig = 215771584;
  optional PlayerGestureConfig playerGestureConfig = 262192541;
  optional InlinePlaybackConfig inlinePlaybackConfig = 399288314;
  optional TaskCoordinatorConfig taskCoordinatorConfig = 403990724;
  optional StickyQualitySelectionConfig stickyQualitySelectionConfig = 120481205;
  optional DaiConfig daiConfig = 182822664;
}

message AudioConfig {
  optional bool muteOnStart = 4;
}

message ExoPlayerConfig {
  optional int32 lowWatermarkMs = 7;
  optional int32 highWatermarkMs = 8;
  optional int32 minDurationForPlaybackStartMs = 17;
  optional bool usePredictedBuffer = 69;
  optional int32 maxReadAheadMediaTimeMs = 70;
  optional bool useMediaTimeCappedLoadControl = 71;
  optional int32 minDurationForPlaybackRestartMs = 75;
}

message AndroidMedialibConfig {
  optional bool isItag18MainProfile = 3;
  optional bool enablePrerollPrebuffer = 19;
  optional bool prebufferOptimizeForViewportSize = 20;
}

message MediaCommonConfig {
  optional DynamicReadaheadConfig dynamicReadaheadConfig = 1;
  optional ServerPlaybackStartConfig serverPlaybackStartConfig = 15;
  optional MediaCacheConfig mediaCacheConfig = 22;
}

message DynamicReadaheadConfig {
}

message ServerPlaybackStartConfig {
}

message MediaCacheConfig {
  optional CacheLoadPolicy cacheLoadPolicy = 1;
}

message CacheLoadPolicy {
}

message TaskCoordinatorConfig {
}

// If the quality selected in the quality menu is used only for the video it was selected for,
// or also for the next videos, and for how long.
message StickyQualitySelectionConfig {
}

// Dynamic ad insertion: ads the server inserts into the SABR stream.
message DaiConfig {
}

message PlayerGestureConfig {
  optional bool downAndOutPortraitAllowed = 1;
  optional bool downAndOutLandscapeAllowed = 2;
}

message InlinePlaybackConfig {
  optional bool showScrubbingControls = 1;
  optional bool showAudioControls = 2;
}