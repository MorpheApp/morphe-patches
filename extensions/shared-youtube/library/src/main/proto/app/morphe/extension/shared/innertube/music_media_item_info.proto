syntax = "proto3";

package app.morphe.extension.shared.innertube;

option optimize_for = LITE_RUNTIME;
option java_package = "app.morphe.extension.shared.innertube";
option java_outer_classname = "MusicMediaItemInfo";

// Android Auto media IDs of YouTube Music are this message, encoded as URL safe Base64.
message MediaItemInfo {
    enum ContainerType {
        UNKNOWN = 0;
        LAST_PLAYED = 1;
        HOME = 2;
        LIBRARY = 3;
        PODCASTS = 4;
    }
    ContainerType containerType = 4;
}
