syntax = "proto3";

import "app/morphe/extension/shared/innertube/guide_response.proto";

package app.morphe.extension.shared.innertube;

option optimize_for = LITE_RUNTIME;
option java_package = "app.morphe.extension.shared.innertube";
option java_outer_classname = "BrowseResponseOuterClass";

message BrowseResponse {
    PageContents contents = 9;
    PageContents continuationContents = 10;
}

message SearchResponse {
    PageContents contents = 4;
}

message PageContents {
    optional bytes sectionListRenderer = 49399797;
    optional bytes messageRenderer = 58508690;
    TabbedResults singleColumnBrowseResultsRenderer = 58173949;
    TabbedResults tabbedSearchResultsRenderer = 60498879;
}

message TabbedResults {
    repeated BrowseTab tabs = 1;
}

message BrowseTab {
    TabRenderer tabRenderer = 58174010;
}

message TabRenderer {
    NavigationEndpoint endpoint = 1;
    bool selected = 3;
    PageContents content = 4;
    string tabIdentifier = 11;
}
