syntax = "proto3";

import "app/morphe/extension/youtube/innertube/guide_response.proto";

package app.morphe.extension.youtube.innertube;

option optimize_for = LITE_RUNTIME;
option java_package = "app.morphe.extension.youtube.innertube";

// Payload of a push notification.
message PushNotificationSupportedRenderers {
    AndroidPushNotificationRenderer androidPushNotificationRenderer = 77819057;
}

message AndroidPushNotificationRenderer {
    // Opened when the notification is tapped.
    NavigationEndpoint navigationEndpoint = 2;
}
