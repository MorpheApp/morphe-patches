syntax = "proto3";

import "app/morphe/extension/youtube/innertube/icon.proto";

package app.morphe.extension.youtube.innertube;

option optimize_for = LITE_RUNTIME;
option java_package = "app.morphe.extension.youtube.innertube";

message GuideResponse {
    Items1 items = 4;
}

message Items1 {
    PivotBarRenderer pivotBarRenderer = 117866661;
    MobileTopbarRenderer mobileTopbarRenderer = 123267149;
}

message MobileTopbarRenderer {
    repeated Buttons buttons = 4;
}

message Buttons {
    oneof data {
        ButtonRenderer buttonRenderer = 65153809;
        TopbarButtonRenderer topbarButtonRenderer = 322055134;
    }
}

message ButtonRenderer {
    optional Icon icon = 8;
    NavigationEndpoint navigationEndpoint = 9;
    optional ButtonRendererAccessibilityData buttonRendererAccessibilityData = 10;
    optional RendererAccessibilityData rendererAccessibilityData = 16;
    optional NavigationEndpoint command = 19;
}

message TopbarButtonRenderer {
}

message RendererAccessibilityData {
    ButtonRendererAccessibilityData buttonRendererAccessibilityData = 75730170;
}

message ButtonRendererAccessibilityData {
    optional string label = 2;
}

message PivotBarRenderer {
    repeated Items2 items = 1;
}

message Items2 {
    oneof data {
        PivotBarIconOnlyItemRenderer pivotBarIconOnlyItemRenderer = 318370163;
        PivotBarItemRenderer pivotBarItemRenderer = 117501096;
    }
}

message PivotBarIconOnlyItemRenderer {
    string pivotIdentifier = 1;
    string targetId = 2;
    NavigationType navigationType = 7;
    Title title = 4;
    Icon icon = 5;
}

enum NavigationType {
    PIVOT_BAR_NAVIGATION_TYPE_UNKNOWN = 0;
    PIVOT_BAR_NAVIGATION_TYPE_SELECT_TAB = 1;
    PIVOT_BAR_NAVIGATION_TYPE_UNSELECTABLE_TAB = 2;
    PIVOT_BAR_NAVIGATION_TYPE_OVERFLOW_TAB = 3;
}

message PivotBarItemRenderer {
    string pivotIdentifier = 1;
    NavigationEndpoint navigationEndpoint = 2;
    Accessibility accessibility = 3;
    Title title = 4;
    Icon icon = 5;
    PresentationStyle presentationStyle = 6;
    string targetId = 10;
}

// Navigation bar item with the renderers as bytes, so no field is lost when the item is converted.
message PivotBarItemBytes {
    oneof data {
        bytes pivotBarIconOnlyItemRenderer = 318370163;
        bytes pivotBarItemRenderer = 117501096;
    }
}

// Fields of PivotBarIconOnlyItemRenderer that PivotBarItemRenderer also has.
message PivotBarIconOnlyItemRendererBytes {
    string pivotIdentifier = 1;
    string targetId = 2;
    bytes navigationEndpoint = 3;
    Title accessibility = 4;
    bytes icon = 5;
    int32 navigationType = 7;
    bytes trackingParams = 9;
    bytes thumbnail = 10;
}

// Fields of PivotBarItemRenderer that PivotBarIconOnlyItemRenderer also has.
message PivotBarItemRendererBytes {
    string pivotIdentifier = 1;
    bytes navigationEndpoint = 2;
    FormattedString title = 3;
    bytes icon = 5;
    bytes trackingParams = 9;
    string targetId = 10;
    int32 navigationType = 11;
    bytes thumbnail = 15;
}

message FormattedString {
    repeated TextRun runs = 1;
}

message TextRun {
    string text = 1;
}

message PresentationStyle {
    int32 pivotBarItemStyle = 1;
}

message Accessibility {
    oneof data {
        AccessibilityData accessibilityData = 1;
    }
}

message AccessibilityData {
    string label = 1;
}

message Title {
    oneof data {
        Runs runs = 75730170;
    }
}

message Runs {
    string text = 2;
}

message NavigationEndpoint {
    optional BrowseEndpoint browseEndpoint = 48687626;
    optional ReelWatchEndpoint reelWatchEndpoint = 139608561;
    optional CreationEntryEndpoint creationEntryEndpoint = 324622913;
    optional SearchEndpoint searchEndpoint = 48687709;
    optional CreationEntrySheetEndpoint creationEntrySheetEndpoint = 144891985;
    optional ShortsCreationEndpoint shortsCreationEndpoint = 307460408;
    optional CreationModesCommand creationModesCommand = 469274066;
}

message CreationEntryEndpoint {
}

// Bottom sheet of the create button of the Android Automotive layout, with the creation buttons.
message CreationEntrySheetEndpoint {
    ButtonSheetSupportedRenderers buttonSheetSupportedRenderers = 1;
}

message ButtonSheetSupportedRenderers {
    ButtonSheetRenderer buttonSheetRenderer = 144798207;
}

message ButtonSheetRenderer {
    repeated Buttons buttons = 1;
}

message ShortsCreationEndpoint {
}

// Opens the creation modes, such as the upload mode, as the create button of the phone layout.
message CreationModesCommand {
    CreationModesControlsRendererHolder creationModesControlsRenderer = 1;
}

message CreationModesControlsRendererHolder {
    CreationModesControlsRenderer creationModesControlsRenderer = 468228182;
}

message CreationModesControlsRenderer {
    CreationModesSwitcherRendererHolder creationModesSwitcherRenderer = 1;
}

message CreationModesSwitcherRendererHolder {
    CreationModesSwitcherRenderer creationModesSwitcherRenderer = 466829302;
}

message CreationModesSwitcherRenderer {
    repeated Buttons modeButtons = 1;
    repeated CreationMode modes = 2;
    CreationMode defaultMode = 3;
    bool defaultToLastUsedMode = 4;
}

enum CreationMode {
    CREATION_MODE_UNKNOWN = 0;
    CREATION_MODE_UPLOADS = 1;
    CREATION_MODE_SHORTS = 2;
    CREATION_MODE_LIVE = 3;
}

message SearchEndpoint {
}

message BrowseEndpoint {
    string browseId = 2;
}

message ReelWatchEndpoint {
    string playlistId = 2;
    string playerParams = 4;
    string params = 11;
    InputType inputType = 12; // or 15
    int64 pageUiType = 27;
    string parentTabIdentifier = 30;
    VideoType videoType = 31;
    string identifier = 53;
}

enum VideoType {
    REEL_VIDEO_TYPE_UNKNOWN = 0;
    REEL_VIDEO_TYPE_STORY = 1;
    REEL_VIDEO_TYPE_VIDEO = 2;
    REEL_VIDEO_TYPE_AD = 3;
    REEL_VIDEO_TYPE_LIVE = 4;
    REEL_VIDEO_TYPE_VOD_VIDEO = 5;
    REEL_VIDEO_TYPE_STACKED_CARDS_PROMO = 6;
    REEL_VIDEO_TYPE_LIVE_PREVIEW = 7;
    REEL_VIDEO_TYPE_MUSIC_SAMPLES = 8;
    REEL_VIDEO_TYPE_MINI_APP_AD = 9;
    REEL_VIDEO_TYPE_POST = 10;
}

enum InputType {
    REEL_WATCH_INPUT_TYPE_UNKNOWN = 0;
    REEL_WATCH_INPUT_TYPE_DEFAULT = 1;
    REEL_WATCH_INPUT_TYPE_SEEDLESS = 2;
    REEL_WATCH_INPUT_TYPE_SEEDLESS_SEQUENCE = 3;
}