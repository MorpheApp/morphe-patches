syntax = "proto3";

package app.morphe.extension.youtube.innertube.elementtexts;

option optimize_for = LITE_RUNTIME;
option java_package = "app.morphe.extension.youtube.innertube";
option java_outer_classname = "ElementTexts";

// Bytes of a Litho element (the newElement of an elementRenderer), with only the texts
// that the video cards (including the duration), the comments and the community posts show. The field numbers are the same as in feed_card_layout.proto.
message Element {
    ElementType type = 1;
    // Elements inside a container element, such as the Short inside the cell of a Short.
    repeated Element children = 3;
}

message ElementType {
    ComponentType componentType = 168777401;
}

message ComponentType {
    ElementModel model = 5;
}

message ElementModel {
    // Feed video (video_lockup_with_attachment.eml).
    VideoWithContextModel videoWithContextModel = 232954548;
    // View models, such as the Short of shorts_video_cell.eml and the video of the card layout (lockup.eml).
    YoutubeModel youtubeModel = 413471385;
    // Comment of comment_thread.eml.
    CommentModel commentModel = 203234692;
    // Title of the video of compact_video.eml (metadata.eml), such as the search results of YouTube 20.26.
    CompactVideoMetadataModel compactVideoMetadataModel = 196274543;

    // Community posts. Each post template has its own model, and they all have the same post fields.
    // The attachments use the same field number with different types, so posts with an attachment
    // that has texts have their own message.
    PostModel textPostModel = 33555388; // text_post_slim.eml
    PostModel imagesPostResponsiveModel = 33556213; // images_post_responsive.eml
    PostModel imagesPostModel = 33556214; // images_post_slim.eml
    VideoPostModel videoPostModel = 33556567; // videos_post.eml
    VideoPostModel videoPostResponsiveModel = 33562168; // videos_post_responsive.eml
    PollPostModel pollPostResponsiveModel = 33557530; // options_post_responsive.eml
    PollPostModel pollPostModel = 33557531; // options_post.eml
    // Post of a shelf of posts (post_base_slim.eml), such as "Latest posts from" a channel in the search results.
    ShelfPostModel shelfPostModel = 263835042;

    // Shelf of videos and Shorts (horizontal_shelf.eml), such as "Latest videos" of a channel in the search results.
    HorizontalShelfModel horizontalShelfModel = 312131490;
    // Shelf of Shorts (shorts_shelf.eml), such as "Latest from" a channel in the search results.
    ShortsShelfModel shortsShelfModel = 315733268;
    // Channel card of the search results (compact_channel.eml).
    CompactChannelModel compactChannelModel = 463210517;
}

message HorizontalShelfModel {
    HorizontalShelfData data = 20;
}

message HorizontalShelfData {
    repeated HorizontalShelfItem items = 17;
}

// Only one of the fields is set.
message HorizontalShelfItem {
    HorizontalShelfVideo video = 1;
    ElementContainer elementContainer = 2; // Such as a Short.
}

message HorizontalShelfVideo {
    VideoData videoData = 1;
}

message ShortsShelfModel {
    ShortsShelfHeader header = 1;
}

message ShortsShelfHeader {
    InnertubeCommandHolder endpoint = 4; // Opens the channel.
}

message CompactChannelModel {
    CompactChannelData data = 1;
}

message CompactChannelData {
    string name = 2;
    InnertubeCommandHolder endpoint = 5; // Opens the channel.
    string handle = 10; // Such as "@handle".
}

message VideoWithContextModel {
    VideoWithContextData data = 18;
}

message VideoWithContextData {
    VideoData videoData = 1;
}

message VideoData {
    VideoThumbnail thumbnail = 1;
    VideoMetadata metadata = 2; // Only in some layouts, such as the horizontal shelves.
    ChannelAvatar avatar = 3;
    string channelId = 9; // Only if the channel is live, where the avatar opens the live video.
    LockupMetadata lockupMetadata = 21;
    // Videos with one of these images have no channel avatar.
    LockupImage decoratedAvatar = 23; // Avatar with a ring, such as the avatar of live channels.
    LockupImage avatarStack = 24; // Avatars of the channels of a collaboration video.
}

message VideoThumbnail {
    string timestampText = 2; // Duration, such as "45:41".
}

message VideoMetadata {
    string title = 1;
    string byline = 3; // Channel, views and date.
}

message LockupImage {
    DecoratedAvatarViewModel decoratedAvatarViewModel = 1105;
    AvatarStackViewModel avatarStackViewModel = 513888437;
}

message DecoratedAvatarViewModel {
    RendererContext rendererContext = 997;
}

message AvatarStackViewModel {
    RendererContext rendererContext = 997;
}

message RendererContext {
    CommandContext commandContext = 3;
}

message CommandContext {
    InnertubeCommandHolder onTap = 3; // Opens the channel, or a sheet with the channels of a collaboration video.
}

message ChannelAvatar {
    InnertubeCommandHolder endpoint = 5;
}

message InnertubeCommandHolder {
    InnertubeCommand innertubeCommand = 169495254;
}

message InnertubeCommand {
    BrowseEndpoint browseEndpoint = 48687626;
    ReelWatchEndpoint reelWatchEndpoint = 139608561;
    CommandWrapper wrapper = 200453700;
    ShowSheetCommand showSheetCommand = 443434441;
}

message CommandWrapper {
    InnertubeCommand command = 1;
}

// Opens a Short.
message ReelWatchEndpoint {
    string sequenceParams = 11; // ReelSequenceParams in Base64.
}

message ReelSequenceParams {
    string channelId = 23; // Channel of the Short. Only in some feeds, such as the search results.
}

// Opens a sheet, such as the list of the channels of a collaboration video.
message ShowSheetCommand {
    PanelLoadingStrategy panelLoadingStrategy = 1;
}

message PanelLoadingStrategy {
    PanelInlineContent inlineContent = 1;
}

message PanelInlineContent {
    PanelContentRenderer panelContentRenderer = 441573002;
}

message PanelContentRenderer {
    repeated PanelContent contents = 4;
}

message PanelContent {
    ElementRenderer elementRenderer = 153515154;
}

message ElementRenderer {
    Element newElement = 172660663;
}

message BrowseEndpoint {
    string browseId = 2; // Channel id, such as "UC...".
    string canonicalBaseUrl = 4; // Handle of the channel, such as "/@handle".
}

message LockupMetadata {
    LockupMetadataViewModel lockupMetadataViewModel = 8178;
}

message LockupMetadataViewModel {
    AttributedText title = 1;
    LockupImage image = 2; // Only in the card layout.
    ContentMetadata metadata = 3;
}

message ContentMetadata {
    ContentMetadataViewModel contentMetadataViewModel = 514549827;
}

// Lines below the title: the channel, the views and the date. Some app versions show them in one text,
// such as "Channel   1.2M   3y ago", and others in separate parts, such as the channel and the views.
message ContentMetadataViewModel {
    repeated MetadataRow metadataRows = 1;
}

message MetadataRow {
    repeated MetadataPart metadataParts = 1;
}

message MetadataPart {
    AttributedText text = 2;
}

message AttributedText {
    string content = 1;
}

message YoutubeModel {
    ViewModelHolder viewModel = 1;
}

message ViewModelHolder {
    ShortsLockupViewModel shortsLockupViewModel = 518308277;
    // Video of the card layout (lockup.eml).
    LockupViewModel lockupViewModel = 8179;
    // Post that shares a post of another channel (shared_post.eml).
    SharedPostViewModel sharedPostViewModel = 1965;
    // Item of a sheet, such as a channel of a collaboration video.
    ListItemViewModel listItemViewModel = 489973921;
}

message LockupViewModel {
    ContentImage contentImage = 2;
    LockupMetadata metadata = 3;
}

message ContentImage {
    ThumbnailViewModel thumbnailViewModel = 1036; // Playlists and mixes have another view model.
}

message ThumbnailViewModel {
    repeated ThumbnailOverlay overlays = 2;
}

message ThumbnailOverlay {
    ThumbnailBottomOverlayViewModel thumbnailBottomOverlayViewModel = 1214;
    ThumbnailOverlayBadgeViewModel thumbnailOverlayBadgeViewModel = 1295;
}

message ThumbnailBottomOverlayViewModel {
    repeated ThumbnailBadge badges = 4;
}

message ThumbnailOverlayBadgeViewModel {
    repeated ThumbnailBadge thumbnailBadges = 1;
}

message ThumbnailBadge {
    ThumbnailBadgeViewModel thumbnailBadgeViewModel = 1128;
}

message ThumbnailBadgeViewModel {
    string text = 2; // Such as the duration "45:41".
}

message ListItemViewModel {
    AttributedText title = 1; // Such as the name of the channel.
    AttributedText subtitle = 2; // Such as the handle and the subscribers of the channel: "@handle - 1.2M subscribers".
}

message ShortsLockupViewModel {
    InnertubeCommandHolder onTap = 6; // Opens the Short.
    ShortsLockupTitle title = 22;
    // Only in some layouts, such as the search results.
    ShortsLockupMetadata metadata = 23;
}

message ShortsLockupTitle {
    AttributedText text = 1;
}

message ShortsLockupMetadata {
    AttributedText channelName = 1;
    ShortsLockupAvatar avatar = 3;
}

message ShortsLockupAvatar {
    AvatarViewModel avatarViewModel = 437811886;
}

message AvatarViewModel {
    InnertubeCommandHolder onTap = 5; // Opens the channel.
}

message CommentModel {
    CommentData data = 1;
}

message CommentData {
    CommentProperties properties = 2;
    CommentAuthor author = 3;
}

message CommentProperties {
    AttributedText content = 3;
}

message CommentAuthor {
    string displayName = 2; // Handle of the author, such as "@handle".
}

message CompactVideoMetadataModel {
    CompactVideoMetadata metadata = 1;
}

message CompactVideoMetadata {
    string title = 1;
}

message PostModel {
    PostData data = 1;
}

message PostData {
    Post post = 1;
}

message Post {
    PostHeader header = 3;
    PostText text = 4;
}

message PostHeader {
    PostAuthor author = 2;
}

message PostAuthor {
    string name = 1;
    InnertubeCommandHolder endpoint = 3; // Opens the channel.
}

message PostText {
    AttributedText text = 1;
}

message VideoPostModel {
    VideoPostData data = 1;
}

message VideoPostData {
    Post post = 1;
    VideoPostAttachment attachment = 6;
}

message VideoPostAttachment {
    VideoData video = 1;
}

message PollPostModel {
    PollPostData data = 1;
}

message PollPostData {
    Post post = 1;
    PollPostAttachment attachment = 6;
}

message PollPostAttachment {
    PollOptions poll = 1768;
}

message PollOptions {
    repeated PollOptionHolder options = 1;
}

message PollOptionHolder {
    PollOption option = 1767;
}

message PollOption {
    string text = 1;
}

message ShelfPostModel {
    ShelfPostData data = 4;
}

message ShelfPostData {
    ShelfPost post = 1;
}

message ShelfPost {
    ShelfPostHeader header = 1;
    ShelfPostBody body = 2;
}

message ShelfPostHeader {
    ShelfPostAuthorRow authorRow = 2;
}

message ShelfPostAuthorRow {
    PostAuthor author = 1;
}

message ShelfPostBody {
    ShelfPostText text = 3;
}

message ShelfPostText {
    AttributedText text = 7;
}

message SharedPostViewModel {
    SharedPostHeader header = 1;
    ElementContainer original = 2;
    SharedPostAvatar avatar = 4;
}

message SharedPostHeader {
    AttributedText text = 2; // Name of the channel that shares the post, and its text.
}

message ElementContainer {
    ElementHolder elementHolder = 36905;
}

message ElementHolder {
    Element element = 1; // Such as the shared post.
}

message SharedPostAvatar {
    AvatarViewModel avatarViewModel = 437811886;
}
